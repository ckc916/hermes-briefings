<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AQHI 空氣質素警示 - Hermes Briefings</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="header">
    <h1><span class="icon">💨</span> AQHI 空氣質素警示</h1>
    <p>香港空氣質素健康指數每小時監測</p>
    <p class="last-update">最後更新：<span id="lastUpdate">--</span></p>
  </div>

  <nav class="nav">
    <a href="../index.html" class="home">🏠 首頁</a>
    <a href="../ai/" class="ai">🤖 AI 新聞</a>
    <a href="../environment/" class="env">🌍 環境快訊</a>
    <a href="index.html" class="aqhi active">💨 AQHI</a>
  </nav>

  <div class="container">
    <div id="alert-list">載入中...</div>
  </div>

  <div class="footer">
    <p>由 <a href="https://github.com/ckc916/hermes-briefings">Hermes Agent</a> 自動生成 · 每小時更新</p>
  </div>

  <script>
    async function load() {
      try {
        const res = await fetch('index.json');
        const data = await res.json();
        document.getElementById('lastUpdate').textContent = data.alerts[0]?.time || '--';
        document.getElementById('alert-list').innerHTML = data.alerts.map(a => `
          <div class="card alert-${a.level}">
            <span class="badge badge-aqhi">AQHI ${a.value || ''}</span>
            <span class="meta">${a.time}</span>
            <h2>${a.title}</h2>
            <a href="${a.file}">查看詳情 →</a>
          </div>
        `).join('') || '<div class="empty">未有 AQHI 警示</div>';
      } catch(e) {
        document.getElementById('alert-list').innerHTML = '<div class="empty">📡 等待第一次 AQHI 警示...</div>';
      }
    }
    load();
  </script>
</body>
</html>
