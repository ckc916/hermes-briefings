<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Briefings - 每日快訊</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="dot dot-ai"></span><span class="dot dot-env"></span>
      <a href="index.html" class="logo">Hermes Briefings</a>
    </div>
    <span class="update-time" id="updateTime">載入中...</span>
  </div>

  <!-- Category Tabs -->
  <div class="main-layout">
    <div class="category-tabs">
      <button class="category-tab active" onclick="filterCategory('all')" id="tab-all">📋 全部</button>
      <button class="category-tab ai" onclick="filterCategory('ai')" id="tab-ai">🤖 AI 新聞</button>
      <button class="category-tab env" onclick="filterCategory('environment')" id="tab-env">🌍 環境快訊</button>
    </div>

    <!-- News Feed -->
    <div id="newsFeed">
      <div class="loading">載入中...</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>由 <a href="https://github.com/ckc916/hermes-briefings">Hermes Agent</a> 自動生成 · 每日更新</p>
  </div>

  <script>
    let allData = null;
    let currentFilter = 'all';

    async function loadNews() {
      try {
        const res = await fetch('news.json?t=' + Date.now());
        allData = await res.json();
        document.getElementById('updateTime').textContent = '更新：' + allData.updated;
        renderNews();
      } catch(e) {
        document.getElementById('newsFeed').innerHTML = `
          <div class="empty-state">
            <div class="icon">📡</div>
            <p>網站剛建立，等待第一次快訊推送...</p>
            <p style="font-size:0.8rem;margin-top:0.5rem">下次部署後會自動更新</p>
          </div>`;
        document.getElementById('updateTime').textContent = '等待首次更新';
      }
    }

    function renderNews() {
      if (!allData || !allData.categories) return;

      let html = '';
      const categories = allData.categories;

      for (const cat of categories) {
        if (currentFilter !== 'all' && cat.id !== currentFilter) continue;
        if (!cat.articles || cat.articles.length === 0) continue;

        html += `
          <div class="category-header">
            <span class="category-title">
              <span class="icon">${cat.icon}</span> ${cat.name}
            </span>
            <span class="category-date">${cat.date}</span>
          </div>`;

        // Group articles by section
        const sections = {};
        for (const article of cat.articles) {
          const section = article.section || '其他';
          if (!sections[section]) sections[section] = [];
          sections[section].push(article);
        }

        for (const [section, articles] of Object.entries(sections)) {
          if (articles.length === 0) continue;
          html += `<div class="section-divider">${section}</div>`;

          for (const article of articles) {
            const sourceHtml = article.source
              ? `<span class="news-source">${article.source}</span>`
              : '';
            const sectionTag = section
              ? `<span class="news-section-tag">${section}</span>`
              : '';

            html += `
              <a href="${article.url}" target="_blank" rel="noopener" class="news-card">
                <div class="news-title">${escapeHtml(article.title)}</div>
                ${article.summary ? `<div class="news-summary">${escapeHtml(article.summary)}</div>` : ''}
                <div class="news-meta">
                  ${sourceHtml}
                  ${sectionTag}
                </div>
              </a>`;
          }
        }
      }

      if (!html) {
        html = `<div class="empty-state"><div class="icon">📭</div><p>暫無新聞</p></div>`;
      }

      document.getElementById('newsFeed').innerHTML = html;
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + cat).classList.add('active');
      renderNews();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadNews();
  </script>
</body>
</html>
