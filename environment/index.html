<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>環境快訊 - Hermes Briefings</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a href="../index.html" class="logo">← Hermes Briefings</a>
    </div>
    <span class="update-time">🌍 環境快訊</span>
  </div>
  <div class="main-layout">
    <div class="category-header">
      <span class="category-title"><span class="icon">🌍</span> 環境新聞摘要</span>
    </div>
    <div id="list">載入中...</div>
  </div>
  <div class="footer">
    <p>由 <a href="https://github.com/ckc916/hermes-briefings">Hermes Agent</a> 自動生成</p>
  </div>
  <script>
    async function load() {
      try {
        const res = await fetch('index.json');
        const data = await res.json();
        document.getElementById('list').innerHTML = data.briefings.map(b => `
          <a href="${b.file}" class="news-card">
            <div class="news-title">${b.title}</div>
            <div class="news-meta"><span class="news-source">${b.date}</span></div>
          </a>
        `).join('') || '<div class="empty-state"><p>暫無摘要</p></div>';
      } catch(e) {
        document.getElementById('list').innerHTML = '<div class="empty-state"><p>載入失敗</p></div>';
      }
    }
    load();
  </script>
</body>
</html>
